<!DOCTYPE html>
<html>
<head>
    <title>GridMind - Monitor en Tiempo Real</title>
    <style>
        body { background: #1a1a2e; color: #00ff88; font-family: monospace; padding: 20px; }
        h1 { color: #00aaff; }
        #log { background: #0d0d1a; padding: 15px; border: 1px solid #00ff88; border-radius: 8px; min-height: 300px; }
        .entry { margin: 5px 0; padding: 5px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <h1>📡 GridMind - Monitor en Tiempo Real</h1>
    <p id="status">⏳ Conectando al servidor...</p>
    <h3>Lecturas en vivo:</h3>
    <div id="log"></div>
    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        const socket = new WebSocket("ws://localhost:8080/ws");
        socket.onopen = () => {
            status.textContent = "🟢 CONECTADO al servidor GridMind";
            socket.send("CONNECT\naccept-version:1.2\n\n\0");
            setTimeout(() => {
                socket.send("SUBSCRIBE\nid:sub-0\ndestination:/topic/energy\n\n\0");
                socket.send("SUBSCRIBE\nid:sub-1\ndestination:/topic/alerts\n\n\0");
                log.innerHTML += '<div class="entry">📡 Escuchando datos del ESP32...</div>';
            }, 500);
        };
        socket.onmessage = (event) => {
            const div = document.createElement('div');
            div.className = 'entry';
            div.textContent = "⚡ " + new Date().toLocaleTimeString() + " → " + event.data;
            log.prepend(div);
        };
        socket.onerror = () => {
            status.textContent = "🔴 Error de conexión";
        };
        socket.onclose = () => {
            status.textContent = "🟡 Desconectado del servidor";
        };
    </script>
</body>
</html>
