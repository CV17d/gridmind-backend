spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gridmind_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Cristian17*}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY}

app:
  frontend:
    url: ${FRONTEND_URL:https://gridmind-on.vercel.app}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: "GridMind <onboarding@resend.dev>"
