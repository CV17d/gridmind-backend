spring:
  config:
    import: optional:file:.env
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gridmind_db}
    username: ${SPRING_DATASOURCE_USERNAME:gridmind_user}
    password: ${SPRING_DATASOURCE_PASSWORD:gridmind_secure_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY:}

app:
  frontend:
    url: ${FRONTEND_URL:https://gridmind-on.vercel.app}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: "GridMind <onboarding@resend.dev>"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,env,metrics"
  endpoint:
    health:
      show-details: always
