name: GridMind Security & Quality CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-test-audit:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Otorgar permisos al Wrapper de Maven
      run: chmod +x mvnw

    - name: Compilación, Pruebas Unitarias y Auditoría OWASP (CVEs)
      # Esto ejecuta las pruebas unitarias y el dependency-check que configuramos
      run: ./mvnw clean verify
      env:
        # Variables por defecto para que las pruebas pasen sin fallar por credenciales nulas
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gridmind_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: password

  load-test:
    name: Auditoría de Concurrencia (Locust)
    runs-on: ubuntu-latest
    needs: build-test-audit
    
    services:
      # Levantamos una base de datos PostgreSQL efímera para la prueba
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gridmind_db
          POSTGRES_USER: gridmind_user
          POSTGRES_PASSWORD: gridmind_secure_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Python 3
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Locust
      run: pip install locust

    - name: Iniciar Servidor Spring Boot en Background
      run: ./mvnw spring-boot:run &
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gridmind_db
        SPRING_DATASOURCE_USERNAME: gridmind_user
        SPRING_DATASOURCE_PASSWORD: gridmind_secure_pass
        # Desactivamos logs verbosos para no saturar Github Actions
        LOGGING_LEVEL_ROOT: WARN

    - name: Esperar a que el servidor esté listo (Health Check)
      run: |
        echo "Esperando a que Spring Boot inicie..."
        until curl -s http://localhost:8080/actuator/health | grep '"status":"UP"'; do
          echo "Servidor no listo, reintentando en 5 segundos..."
          sleep 5
        done
        echo "¡El servidor está listo!"

    - name: Ejecutar Prueba de Estrés Corta
      # Ejecuta Locust en modo consola (headless) por 30 segundos con 50 usuarios recurrentes.
      # Si la tasa de fallo es muy alta, el comando fallará y Github Actions bloqueará el PR.
      run: locust -f load-tests/locustfile.py --headless -u 50 -r 10 --run-time 30s --host=http://localhost:8080 --only-summary --exit-code-on-error 1
