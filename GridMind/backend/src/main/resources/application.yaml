spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gridmind_db
    username: postgres
    password: Cristian17*
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
